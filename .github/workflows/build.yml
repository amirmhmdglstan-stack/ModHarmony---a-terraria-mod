name: Build ModHarmony

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download tModLoader stable release
        run: |
          curl -sL -o tml.zip "https://github.com/tModLoader/tModLoader/releases/download/v2026.06.3.6/tModLoader.zip"
          unzip -q tml.zip -d tml
          echo "--- tML root ---"
          ls tml | head -25
          echo "--- tMLMod.targets present? ---"
          ls tml/tMLMod.targets || echo "MISSING tMLMod.targets"

      - name: Create local tModLoader.targets shim
        run: |
          cat > tModLoader.targets <<'EOF'
          <Project>
            <Import Project="$(tMLPath)/tMLMod.targets" />
          </Project>
          EOF

      - name: Compile mod
        run: |
          dotnet build ModHarmony.csproj -c Release -p:tMLPath=$PWD/tml -p:BuildMod=true
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'

      - name: Upload .tmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModHarmony-tmod
          path: |
            bin/Release/**/ModHarmony.tmod
            bin/Release/**/ModHarmony.dll
          if-no-files-found: error
